<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">One event, from Ring to Vega</title><desc id="desc">Ring delivers an event to SmartDetector's queue and worker. SmartDetector optionally summarizes incident observations with Bedrock. Additional visual detection is an external add-on. Stored incidents reach the paired Vega app. Schematic, not a screenshot.</desc>
<rect width="1200" height="280" rx="20" fill="#eef6fa"/>
<g font-family="sans-serif" fill="#123248"><text x="32" y="43" font-size="25" font-weight="700">One event. One shared evidence trail.</text>
<g fill="white" stroke="#b8d1df" stroke-width="2"><rect x="32" y="82" width="185" height="125" rx="12"/><rect x="265" y="82" width="190" height="125" rx="12"/><rect x="503" y="82" width="210" height="125" rx="12"/><rect x="761" y="82" width="185" height="125" rx="12"/><rect x="994" y="82" width="174" height="125" rx="12"/></g>
<g font-size="21" font-weight="700"><text x="52" y="118">Ring</text><text x="285" y="118">SmartDetector</text><text x="523" y="118">AI context</text><text x="781" y="118">Saved incident</text><text x="1014" y="118">Vega app</text></g>
<g font-size="15"><text x="52" y="150">Authorized camera</text><text x="52" y="176">Motion / doorbell</text><text x="285" y="150">Queue + worker</text><text x="285" y="176">Sampled evidence</text><text x="523" y="150">Incident summaries</text><text x="523" y="176">Optional Bedrock</text><text x="781" y="150">History + storage</text><text x="781" y="176">Location-scoped</text><text x="1014" y="150">Browse + review</text><text x="1014" y="176">Read-only display</text></g>
<g fill="#007eb8" font-size="28"><text x="230" y="154">→</text><text x="468" y="154">→</text><text x="726" y="154">→</text><text x="959" y="154">→</text></g>
<text x="32" y="247" font-size="15">Optional external add-on supplies visual detections. Bedrock summaries are not an image detector.</text>
</g></svg>
