      "Properties": {
        "Cluster": {
          "Ref": "Cluster"
        },
        "LaunchType": "FARGATE",
        "DesiredCount": {
          "Ref": "DesiredCount"
        },
        "TaskDefinition": {
          "Ref": "WorkerTask"
        },
        "NetworkConfiguration": {
          "AwsvpcConfiguration": {
            "AssignPublicIp": "DISABLED",
            "Subnets": {
              "Ref": "PrivateSubnets"
            },
            "SecurityGroups": [
              {
                "Ref": "ServiceSG"
              }
            ]
          }
        },
        "PlatformVersion": "1.4.0"
      }
    },
    "BedrockAccess": {
      "Type": "AWS::IAM::Policy",
      "Condition": "UseBedrock",
      "Properties": {
        "PolicyName": "smartdetector-bedrock",
        "Roles": [
          {
            "Ref": "TaskRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": "bedrock:InvokeModel",
              "Resource": {
                "Ref": "BedrockModelArn"
              }
            }
          ]
        }
      }
    },
    "IncidentRule": {
      "Type": "AWS::Events::Rule",
      "Properties": {
        "EventBusName": {
          "Ref": "EventBus"
        },
        "EventPattern": {
          "source": [
            "smartdetector"
          ],
          "detail-type": [
            "IncidentCreated"
          ]
        },
        "Targets": [
          {
            "Id": "IncidentQueue",
            "Arn": {
              "Fn::GetAtt": [
                "Queue",
                "Arn"
              ]
            }
          }
        ]
      },
      "Condition": "UseEventBridge"
    },
    "QueuePolicy": {
      "Type": "AWS::SQS::QueuePolicy",
      "Properties": {
        "Queues": [
          {
            "Ref": "Queue"
          },
          {
            "Ref": "DeadLetterQueue"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyInsecureTransport",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "sqs:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "Queue",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "DeadLetterQueue",
                    "Arn"
                  ]
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false",
                  "aws:PrincipalIsAWSService": "false"
                }
              }
            },
            {
              "Fn::If": [
                "UseEventBridge",
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "events.amazonaws.com"
                  },
                  "Action": "sqs:SendMessage",
                  "Resource": {
                    "Fn::GetAtt": [
                      "Queue",
                      "Arn"
                    ]
                  },
                  "Condition": {
                    "ArnEquals": {
                      "aws:SourceArn": {
                        "Fn::GetAtt": [
                          "IncidentRule",
                          "Arn"
                        ]
                      }
                    }
                  }
                },
                {
                  "Ref": "AWS::NoValue"
                }
              ]
            }
          ]
        }
      }
    },
    "ApplicationDns": {
      "Type": "AWS::Route53::RecordSet",
      "Condition": "CreateDns",
      "Properties": {
        "HostedZoneId": {
          "Ref": "HostedZoneId"
        },
        "Name": {
          "Ref": "DomainName"
        },
        "Type": "A",
        "AliasTarget": {
          "DNSName": {
            "Fn::GetAtt": [
              "ALB",
              "DNSName"
            ]
          },
          "HostedZoneId": {
            "Fn::GetAtt": [
              "ALB",
              "CanonicalHostedZoneID"
            ]
          }
        }
      }
    },
    "AutoVisionServiceSecretRead": {
      "Type": "AWS::IAM::Policy",
      "Condition": "UseAutoVisionSecret",
      "Properties": {
        "PolicyName": "autovision-service-secret-read",
        "Roles": [
          {
            "Ref": "ExecutionRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "secretsmanager:GetSecretValue"
              ],
              "Resource": {
                "Ref": "AutoVisionApiKeySecretArn"
              }
            }
          ]
        }
      }
    },
    "AdmCredentials": {
      "Type": "AWS::SecretsManager::Secret",
      "Condition": "UseAdmCredentials",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": "Server-only SmartDetector ADM OAuth credentials",
        "SecretString": {
          "Fn::Sub": "{\"client_id\":\"${AdmClientId}\",\"client_secret\":\"${AdmClientSecret}\"}"
        }
      }
    },
    "EvidenceBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "EvidenceBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyInsecureTransport",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "EvidenceBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${EvidenceBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false",
                  "aws:PrincipalIsAWSService": "false"
                }
              }
            }
          ]
        }
      }
    },
    "StripeCredentials": {
      "Type": "AWS::SecretsManager::Secret",
      "Condition": "CreateStripeSecret",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": {
          "Fn::Sub": "${AWS::StackName} Stripe credentials; separate live and sandbox deployments"
        },
        "KmsKeyId": {
          "Fn::If": [
            "UseStripeKmsKey",
            {
              "Ref": "StripeCredentialsKmsKeyArn"
            },
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "SecretString": {
          "Fn::Sub": "{\"secret_key\":\"${StripeSecretKey}\",\"webhook_secret\":\"${StripeWebhookSecret}\"}"
        }
      }
    },
    "RootPasswordSecret": {
      "Type": "AWS::SecretsManager::Secret",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": {
          "Fn::Sub": "${AWS::StackName} RootPassword; preserve value during migration"
        },
        "KmsKeyId": {
          "Fn::If": [
            "UseCoreSecretsKmsKey",
            {
              "Ref": "CoreSecretsKmsKeyArn"
            },
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "SecretString": {
          "Ref": "RootPassword"
        }
      }
    },
    "SessionSigningSecret": {
      "Type": "AWS::SecretsManager::Secret",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": {
          "Fn::Sub": "${AWS::StackName} SessionSecret; preserve value during migration"
        },
        "KmsKeyId": {
          "Fn::If": [
            "UseCoreSecretsKmsKey",
            {
              "Ref": "CoreSecretsKmsKeyArn"
            },
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "SecretString": {
          "Ref": "SessionSecret"
        }
      }
    },
    "ProviderEncryptionSecret": {
      "Type": "AWS::SecretsManager::Secret",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": {
          "Fn::Sub": "${AWS::StackName} ProviderSecret; preserve value during migration"
        },
        "KmsKeyId": {
          "Fn::If": [
            "UseCoreSecretsKmsKey",
            {
              "Ref": "CoreSecretsKmsKeyArn"
            },
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "SecretString": {
          "Fn::If": [
            "HasProviderSecret",
            {
              "Ref": "ProviderSecret"
            },
            {
              "Ref": "SessionSecret"
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "URL": {
      "Value": {
        "Fn::Sub": "https://${ALB.DNSName}"
      }
    },
    "Table": {
      "Value": {
        "Ref": "AppTable"
      }
    },
    "EventBusName": {
      "Value": {
        "Fn::If": [
          "UseEventBridge",
          {
            "Ref": "EventBus"
          },
          "disabled-direct-sqs"
        ]
      }
    },
    "EvidenceBucketName": {
      "Value": {
        "Ref": "EvidenceBucket"
      }
    },
    "ApplicationDomain": {
      "Value": {
        "Ref": "DomainName"
      }
    },
    "AdmCredentialsSecretArn": {
      "Condition": "UseAdmCredentials",
      "Description": "Managed ADM secret ARN; credential values are never output",
      "Value": {
        "Ref": "AdmCredentials"
      }
    },
    "StripeCredentialsSecretArn": {
      "Condition": "UseStripeCredentials",
      "Description": "Stripe secret ARN only; values are never output.",
      "Value": {
        "Fn::If": [
          "UseExternalStripeSecret",
          {
            "Ref": "StripeCredentialsSecretArn"
          },
          {
            "Ref": "StripeCredentials"
          }
        ]
      }
    },
    "RootPasswordSecretArn": {
      "Description": "Secret ARN only; never the credential value.",
      "Value": {
        "Ref": "RootPasswordSecret"
      }
    },
    "SessionSigningSecretArn": {
      "Description": "Secret ARN only; never the credential value.",
      "Value": {
        "Ref": "SessionSigningSecret"
      }
    },
    "ProviderEncryptionSecretArn": {
      "Description": "Secret ARN only; never the credential value.",
      "Value": {
        "Ref": "ProviderEncryptionSecret"
      }
    }
  },
  "Rules": {
    "AdmCredentialPair": {
      "Assertions": [
        {
          "Assert": {
            "Fn::Or": [
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "AdmClientId"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "AdmClientSecret"
                      },
                      ""
                    ]
                  }
                ]
              },
              {
                "Fn::And": [
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "AdmClientId"
                          },
                          ""
                        ]
                      }
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "AdmClientSecret"
                          },
                          ""
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "AssertDescription": "Provide both AdmClientId and AdmClientSecret, or leave both empty."
        }
      ]
    },
    "SaasEmailSenderRequired": {
      "RuleCondition": {
        "Fn::Equals": [
          {
            "Ref": "DeploymentMode"
          },
          "saas"
        ]
      },
      "Assertions": [
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "SesFrom"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "SaaS mode requires an SES-verified sender for account verification."
        },
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "PublicOrigin"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "SaaS mode requires a canonical HTTPS origin for authentication emails."
        }
      ]
    },
    "StripeCredentialSource": {
      "Assertions": [
        {
          "Assert": {
            "Fn::Or": [
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeSecretKey"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeWebhookSecret"
                      },
                      ""
                    ]
                  }
                ]
              },
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeCredentialsSecretArn"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "StripeSecretKey"
                          },
                          ""
                        ]
                      }
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "StripeWebhookSecret"
                          },
                          ""
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "AssertDescription": "Supply both raw Stripe credentials or an existing secret ARN, never partial credentials or both sources."
        }
      ]
    }
  }
}

