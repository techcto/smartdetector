{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "SmartDetector SaaS or private application on ECS Fargate",
  "Parameters": {
    "VpcId": {
      "Type": "AWS::EC2::VPC::Id"
    },
    "PublicSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "PrivateSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "ImageBase": {
      "Type": "String",
      "Description": "ECR registry/repository prefix without service suffix"
    },
    "ReleaseVersion": {
      "Type": "String",
      "AllowedPattern": "[0-9A-Za-z.-]+",
      "Description": "Immutable published image tag"
    },
    "CertificateArn": {
      "Type": "String",
      "AllowedPattern": "^arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-zA-Z0-9-]+$",
      "Description": "Required issued ACM certificate for the public HTTPS listener."
    },
    "RootUsername": {
      "Type": "String",
      "Default": "root",
      "MinLength": 3
    },
    "RootPassword": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 12,
      "Description": "Root bootstrap password, stored in a retained Secrets Manager secret. Preserve existing value on migration."
    },
    "SessionSecret": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 32,
      "Description": "Session signing secret stored in Secrets Manager. Preserve existing value on migration; changing it invalidates sessions."
    },
    "DeploymentMode": {
      "Type": "String",
      "Default": "on-premise",
      "AllowedValues": [
        "on-premise",
        "saas"
      ]
    },
    "DesiredCount": {
      "Type": "Number",
      "Default": 1,
      "MinValue": 1
    },
    "StripeSecretKey": {
      "AllowedPattern": "^$|^(sk|rk)_(live|test)_[a-zA-Z0-9]+$",
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "Description": "Optional initial Stripe secret key. Stored in a retained Secrets Manager secret, never a task definition environment value. Prefer an existing secret ARN for enterprise installs."
    },
    "StripeWebhookSecret": {
      "AllowedPattern": "^$|^whsec_[a-zA-Z0-9]+$",
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "Description": "Stripe webhook signing secret paired with StripeSecretKey. Stored in Secrets Manager."
    },
    "StripeStarterPriceId": {
      "Type": "String",
      "Default": ""
    },
    "StripeScalePriceId": {
      "Type": "String",
      "Default": ""
    },
    "SesFrom": {
      "Type": "String",
      "Default": "",
      "Description": "SES-verified sender in this AWS region. Required for SaaS signup verification, e.g. noreply@smartdetector.com."
    },
    "WhatsappOriginationId": {
      "Type": "String",
      "Default": ""
    },
    "NotificationRecipients": {
      "Type": "String",
      "Default": ""
    },
    "AutoVisionUrl": {
      "Type": "String",
      "Default": "https://autovision.dev",
      "Description": "Your hosted AutoVision HTTPS URL (no trailing slash)"
    },
    "BedrockModelId": {
      "Type": "String",
      "Default": "",
      "Description": "Optional Bedrock model/inference-profile ID for enrichment"
    },
    "BedrockModelArn": {
      "Type": "String",
      "Default": "",
      "Description": "ARN authorized for bedrock:InvokeModel; include inference profiles as required"
    },
    "ProviderSecret": {
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "AllowedPattern": "^$|^.{32,}$",
      "Description": "Provider encryption key stored in Secrets Manager. Empty uses the exact SessionSecret value. Preserve existing effective value; rotation requires re-encrypting stored provider credentials."
    },
    "DomainName": {
      "Type": "String",
      "Default": "smartdetector.com",
      "Description": "Public application domain; certificate must cover this name"
    },
    "HostedZoneId": {
      "Type": "String",
      "Default": "",
      "Description": "Optional Route 53 public zone for the application alias"
    },
    "MarketplaceUrl": {
      "Type": "String",
      "Default": "https://aws.amazon.com/marketplace/pp/prodview-l5jk7kn3222am",
      "AllowedPattern": "^$|^https://aws\\.amazon\\.com/marketplace/[^\\s]+$",
      "Description": "Buyer-facing Marketplace listing URL. Leave empty to hide the subscription button."
    },
    "EventBridgeEnabled": {
      "Type": "String",
      "Default": "true",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Use EventBridge to deliver incidents. Set false for direct SQS delivery."
    },
    "AutoVisionApiKeySecretArn": {
      "Type": "String",
      "Default": "",
      "Description": "Optional same-region Secrets Manager ARN. The entire secret value must be the AutoVision service API key; use the AWS-managed Secrets Manager encryption key."
    },
    "AdmClientId": {
      "Type": "String",
      "Default": "",
      "NoEcho": true,
      "MaxLength": 512,
      "AllowedPattern": "[A-Za-z0-9._-]*",
      "Description": "Optional ADM client ID from Amazon Developer security profile Web Settings. Provide both ADM fields to enable background TV alerts."
    },
    "AdmClientSecret": {
      "Type": "String",
      "Default": "",
      "NoEcho": true,
      "MaxLength": 4096,
      "AllowedPattern": "[A-Za-z0-9._~+/-]*",
      "Description": "ADM client secret. CloudFormation stores it in Secrets Manager; never commit populated parameters."
    },
    "BlockedSignupDomains": {
      "Type": "String",
      "Default": "",
      "MaxLength": 2048,
      "Description": "Optional comma-separated domains blocked for new accounts, e.g. gmail.com,googlemail.com. Empty allows all domains."
    },
    "PublicOrigin": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^https://[a-zA-Z0-9.-]+(?::[0-9]+)?$",
      "Description": "Canonical HTTPS site origin for verification/password-reset links. Required in SaaS mode, e.g. https://smartdetector.com."
    },
    "StripeCredentialsSecretArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+$",
      "Description": "Optional existing same-account, same-region Stripe JSON secret ARN. Keys: secret_key and webhook_secret. Leave raw Stripe parameters empty when supplied."
    },
    "StripeCredentialsKmsKeyArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$",
      "Description": "Optional customer-managed KMS key ARN for the Stripe secret. Key policy must permit the task execution role to decrypt."
    },
    "StripeCredentialsRevision": {
      "Type": "String",
      "Default": "1",
      "AllowedPattern": "[a-zA-Z0-9.-]+",
      "Description": "Increment after rotating Stripe credentials to roll tasks through a reviewed CloudFormation change set."
    },
    "CoreSecretsKmsKeyArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$",
      "Description": "Optional customer-managed KMS key for root, session and provider secrets. Key policy must permit the execution role to decrypt."
    },
    "CoreSecretsRevision": {
      "Type": "String",
      "Default": "1",
      "AllowedPattern": "[a-zA-Z0-9.-]+",
      "Description": "Increment when changing core secrets to roll tasks through CloudFormation. Do not rotate the provider encryption key without re-encrypting existing records."
    }
  },
  "Conditions": {
    "UseBedrock": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "BedrockModelArn"
            },
            ""
          ]
        }
      ]
    },
    "CreateDns": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "HostedZoneId"
            },
            ""
          ]
        }
      ]
    },
    "UseEventBridge": {
      "Fn::Equals": [
        {
          "Ref": "EventBridgeEnabled"
        },
        "true"
      ]
    },
    "UseAutoVisionSecret": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "AutoVisionApiKeySecretArn"
            },
            ""
          ]
        }
      ]
    },
    "UseAdmCredentials": {
      "Fn::And": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "AdmClientId"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "AdmClientSecret"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "UseExternalStripeSecret": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsSecretArn"
            },
            ""
          ]
        }
      ]
    },
    "CreateStripeSecret": {
      "Fn::And": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsSecretArn"
            },
            ""
          ]
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeSecretKey"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "UseStripeCredentials": {
      "Fn::Or": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeCredentialsSecretArn"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeSecretKey"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "UseStripeKmsKey": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsKmsKeyArn"
            },
            ""
          ]
        }
      ]
    },
    "UseStripeKmsAccess": {
      "Fn::And": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeCredentialsKmsKeyArn"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Or": [
            {
              "Fn::Not": [
                {
                  "Fn::Equals": [
                    {
                      "Ref": "StripeCredentialsSecretArn"
                    },
                    ""
                  ]
                }
              ]
            },
            {
              "Fn::Not": [
                {
                  "Fn::Equals": [
                    {
                      "Ref": "StripeSecretKey"
                    },
                    ""
                  ]
                }
              ]
            }
          ]
        }
      ]
    },
    "UseCoreSecretsKmsKey": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "CoreSecretsKmsKeyArn"
            },
            ""
          ]
        }
      ]
    },
    "HasProviderSecret": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "ProviderSecret"
            },
            ""
          ]
        }
      ]
    }
  },
  "Resources": {
    "Cluster": {
      "Type": "AWS::ECS::Cluster",
      "Properties": {
        "ClusterSettings": [
          {
            "Name": "containerInsights",
            "Value": "enabled"
          }
        ]
      }
    },
    "ALBSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "SmartDetector public ingress",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "CidrIp": "0.0.0.0/0"
          },
          {
            "IpProtocol": "tcp",
            "FromPort": 443,
            "ToPort": 443,
            "CidrIp": "0.0.0.0/0"
          }
        ]
      }
    },
    "ServiceSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "SmartDetector application tasks",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 3000,
            "ToPort": 3001,
            "SourceSecurityGroupId": {
              "Ref": "ALBSG"
            }
          }
        ]
      }
    },
    "ALB": {
      "Type": "AWS::ElasticLoadBalancingV2::LoadBalancer",
      "Properties": {
        "Subnets": {
          "Ref": "PublicSubnets"
        },
        "SecurityGroups": [
          {
            "Ref": "ALBSG"
          }
        ]
      }
    },
    "WebTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3000,
        "Protocol": "HTTPS",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health",
        "HealthCheckProtocol": "HTTPS"
      }
    },
    "ApiTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3001,
        "Protocol": "HTTPS",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health",
        "HealthCheckProtocol": "HTTPS"
      }
    },
    "Listener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 80,
        "Protocol": "HTTP",
        "DefaultActions": [
          {
            "Type": "redirect",
            "RedirectConfig": {
              "Protocol": "HTTPS",
              "Port": "443",
              "StatusCode": "HTTP_301"
            }
          }
        ]
      }
    },
    "ApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "Listener"
        },
        "Priority": 10,
        "Conditions": [
          {
            "Field": "path-pattern",
            "Values": [
              "/api/*"
            ]
          }
        ],
        "Actions": [
          {
            "Type": "redirect",
            "RedirectConfig": {
              "Protocol": "HTTPS",
              "Port": "443",
              "StatusCode": "HTTP_301"
            }
          }
        ]
      }
    },
    "HttpsListener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 443,
        "Protocol": "HTTPS",
        "Certificates": [
          {
            "CertificateArn": {
              "Ref": "CertificateArn"
            }
          }
        ],
        "DefaultActions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "WebTarget"
            }
          }
        ],
        "SslPolicy": "ELBSecurityPolicy-TLS13-1-2-2021-06"
      }
    },
    "HttpsApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "HttpsListener"
        },
        "Priority": 10,
        "Conditions": [
          {
            "Field": "path-pattern",
            "Values": [
              "/api/*"
            ]
          }
        ],
        "Actions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "ApiTarget"
            }
          }
        ]
      }
    },
    "Queue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 120,
        "MessageRetentionPeriod": 345600,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "DeadLetterQueue",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        },
        "SqsManagedSseEnabled": true
      }
    },
    "DeadLetterQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600,
        "SqsManagedSseEnabled": true
      }
    },
    "AppTable": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "sk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1sk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "tenantId",
            "AttributeType": "S"
          },
          {
            "AttributeName": "incidentTime",
            "AttributeType": "S"
          },
          {
            "AttributeName": "incidentDevice",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "pk",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "sk",
            "KeyType": "RANGE"
          }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "GSI1",
            "KeySchema": [
              {
                "AttributeName": "gsi1pk",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "gsi1sk",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          },
          {
            "IndexName": "IncidentsByTime",
            "KeySchema": [
              {
                "AttributeName": "tenantId",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "incidentTime",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "KEYS_ONLY"
            }
          },
          {
            "IndexName": "IncidentsByDevice",
            "KeySchema": [
              {
                "AttributeName": "incidentDevice",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "incidentTime",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "KEYS_ONLY"
            }
          }
        ],
        "TimeToLiveSpecification": {
          "AttributeName": "ttl",
          "Enabled": true
        },
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true
        },
        "SSESpecification": {
          "SSEEnabled": true
        }
      }
    },
    "EvidenceBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        }
      }
    },
    "EventBus": {
      "Type": "AWS::Events::EventBus",
      "Properties": {
        "Name": {
          "Fn::Sub": "${AWS::StackName}-events"
        }
      },
      "Condition": "UseEventBridge"
    },
    "LogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "RetentionInDays": 30
      }
    },
    "ExecutionRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
          }
        ],
        "Policies": [
          {
            "Fn::If": [
              "UseAdmCredentials",
              {
                "PolicyName": "adm-credentials-read",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": [
                        "secretsmanager:GetSecretValue"
                      ],
                      "Resource": {
                        "Ref": "AdmCredentials"
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          },
          {
            "PolicyName": "RequireSecureTransport",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Deny",
                  "Action": "*",
                  "Resource": "*",
                  "Condition": {
                    "Bool": {
                      "aws:SecureTransport": "false"
                    }
                  }
                }
              ]
            }
          },
          {
            "Fn::If": [
              "UseStripeCredentials",
              {
                "PolicyName": "stripe-credentials-read",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "secretsmanager:GetSecretValue",
                      "Resource": {
                        "Fn::If": [
                          "UseExternalStripeSecret",
                          {
                            "Ref": "StripeCredentialsSecretArn"
                          },
                          {
                            "Ref": "StripeCredentials"
                          }
                        ]
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          },
          {
            "Fn::If": [
              "UseStripeKmsAccess",
              {
                "PolicyName": "stripe-key-decrypt",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "kms:Decrypt",
                      "Resource": {
                        "Ref": "StripeCredentialsKmsKeyArn"
                      },
                      "Condition": {
                        "StringEquals": {
                          "kms:ViaService": {
                            "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                          },
                          "kms:EncryptionContext:SecretARN": {
                            "Fn::If": [
                              "UseExternalStripeSecret",
                              {
                                "Ref": "StripeCredentialsSecretArn"
                              },
                              {
                                "Ref": "StripeCredentials"
                              }
                            ]
                          }
                        }
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          },
          {
            "PolicyName": "core-secrets-read",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "secretsmanager:GetSecretValue",
                  "Resource": [
                    {
                      "Ref": "RootPasswordSecret"
                    },
                    {
                      "Ref": "SessionSigningSecret"
                    },
                    {
                      "Ref": "ProviderEncryptionSecret"
                    }
                  ]
                }
              ]
            }
          },
          {
            "Fn::If": [
              "UseCoreSecretsKmsKey",
              {
                "PolicyName": "core-secrets-decrypt",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "kms:Decrypt",
                      "Resource": {
                        "Ref": "CoreSecretsKmsKeyArn"
                      },
                      "Condition": {
                        "StringEquals": {
                          "kms:ViaService": {
                            "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                          },
                          "kms:EncryptionContext:SecretARN": [
                            {
                              "Ref": "RootPasswordSecret"
                            },
                            {
                              "Ref": "SessionSigningSecret"
                            },
                            {
                              "Ref": "ProviderEncryptionSecret"
