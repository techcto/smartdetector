name: Release SmartDetector
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version: {description: Immutable version without leading v, required: true}
permissions: {contents: read, id-token: write}
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  MP_AWS_ECR: ${{ vars.MP_AWS_ECR }}
  REPOSITORY_PREFIX: ${{ vars.REPOSITORY_PREFIX || 'solodev/smartdetector' }}
  ASSETS_BUCKET: ${{ vars.ASSETS_BUCKET || 'smartdetector' }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: 26, cache: npm}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ vars.MP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MP_AWS_SECRET_ACCESS_KEY }}
      - name: Log in to publishing registry
        run: |
          test -n "$MP_AWS_ECR"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$MP_AWS_ECR"
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish service images
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
          REGISTRY: ${{ vars.MP_AWS_ECR }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          case "$version" in ''|*[!0-9A-Za-z.-]*) exit 1;; esac
          test -n "$ASSETS_BUCKET"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "MP_AWS_ECR=$REGISTRY" >> "$GITHUB_ENV"
          for service in web api worker; do
            repository="$REPOSITORY_PREFIX-$service"
            aws ecr describe-repositories --repository-names "$repository" >/dev/null
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --push -f "devops/docker/Dockerfile.$service" -t "$REGISTRY/$REPOSITORY_PREFIX-$service:$version" .
          done
      - name: Publish deployment templates
        run: |
          for template in devops/cloudformation/*.yaml; do
            base="$(basename "$template" .yaml)"
            aws s3 cp "$template" "s3://$ASSETS_BUCKET/cloudformation/$base-$RELEASE_VERSION.yaml" --content-type text/yaml --cache-control 'max-age=31536000,immutable'
            aws s3 cp "$template" "s3://$ASSETS_BUCKET/cloudformation/$base.yaml" --content-type text/yaml --cache-control no-cache
          done
          bash devops/public-assets.sh
      - name: Submit Marketplace delivery changeset
        if: ${{ vars.MP_AWS_MARKETPLACE_PRODUCT_ID != '' }}
        env:
          MP_AWS_MARKETPLACE_PRODUCT_ID: ${{ vars.MP_AWS_MARKETPLACE_PRODUCT_ID }}
        run: bash devops/changeset.sh


