name: SmartDetector CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions: {contents: read}
jobs:
  native-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm --prefix apps/vega/preview ci
      - run: npm --prefix apps/vega/preview run build
      - run: cd apps/vega/preview && npx playwright install --with-deps chromium
      - name: Test desktop and mobile shared native UI
        run: |
          npm --prefix apps/vega/preview run dev > /tmp/native-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8084 >/dev/null; then break; fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:8084 npm --prefix apps/vega/preview run test:browser
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: 26, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:web
      - run: npm --prefix apps/vega ci
      - run: npm --prefix apps/vega test
      - run: npm --prefix submodules/smartdetector-agentcore ci && npm run test:agentcore
      - run: npm run build
      - run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install cfn-lint
      - run: cfn-lint devops/cloudformation/*.yaml submodules/smartdetector-agentcore/devops/cloudformation/*.yaml
      - run: bash -n devops/changeset.sh
      - run: bash -n submodules/smartdetector-agentcore/devops/changeset.sh
      - run: DRY_RUN=1 MP_AWS_AGENTCORE_PRODUCT_ID=synthetic-agentcore MP_AWS_ECR=example.invalid RELEASE_VERSION=0.1.0 bash submodules/smartdetector-agentcore/devops/changeset.sh
      - run: DRY_RUN=1 MP_AWS_MARKETPLACE_PRODUCT_ID=synthetic-product MP_AWS_ECR=example.invalid RELEASE_VERSION=0.1.0 bash devops/changeset.sh > /tmp/changeset.json
      - run: docker network create application-platforms-local
      - run: docker compose build


