name: Release native Vega Console
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Native app version without leading v
        required: true
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 26}
      - run: npm --prefix apps/vega ci
      - run: npm --prefix apps/vega test
      - name: Archive native source and build instructions
        run: git archive --format=tar.gz --output=smartdetector-vega-source.tar.gz HEAD apps/vega
      - uses: actions/upload-artifact@v4
        with:
          name: smartdetector-vega-source-${{ github.ref_name }}
          path: smartdetector-vega-source.tar.gz
          retention-days: 90
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: vega-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smartdetector-vega-armv7-${{ github.ref_name }}
          path: release/armv7
      - uses: actions/download-artifact@v4
        with:
          name: smartdetector-vega-x86_64-${{ github.ref_name }}
          path: release/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: smartdetector-vega-source-${{ github.ref_name }}
          path: release
      - name: Prepare public app download
        working-directory: release
        run: |
          set -euo pipefail
          test -s armv7/armv7-release/smartdetectorconsole_armv7.vpkg
          test -s x86_64/x86_64-release/smartdetectorconsole_x86_64.vpkg
          mv armv7/armv7-release/smartdetectorconsole_armv7.vpkg .
          mv x86_64/x86_64-release/smartdetectorconsole_x86_64.vpkg .
          cp armv7/sdk-version.txt armv7/native-package-lock.json armv7/security-audit.json .
          sha256sum smartdetectorconsole_armv7.vpkg smartdetectorconsole_x86_64.vpkg > SHA256SUMS
          test -s sdk-version.txt
          test -s native-package-lock.json
          test -s security-audit.json
          test -s smartdetector-vega-source.tar.gz
      - name: Publish versioned app and update latest download
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_id="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          if [ -n "$release_id" ]; then
            [[ "$release_id" =~ ^[0-9]+$ ]]
            if [ "$(gh api "repos/$GH_REPO/releases/$release_id" --jq '.draft')" != true ]; then
              gh api "repos/$GH_REPO/releases/$release_id/assets" --jq '.[].name' > published-assets.txt
              for asset in smartdetectorconsole_armv7.vpkg smartdetectorconsole_x86_64.vpkg SHA256SUMS sdk-version.txt native-package-lock.json security-audit.json smartdetector-vega-source.tar.gz; do
                grep -Fx "$asset" published-assets.txt
              done
              echo 'Published app release already exists; leaving assets unchanged.'
              exit 0
            fi
          else
            gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null
            release_id="$(gh api --method POST "repos/$GH_REPO/releases" -f tag_name="$RELEASE_TAG" -F draft=true -f name="SmartDetector Vega $RELEASE_TAG" -f body='Two native Release packages connected to https://smartdetector.com: x86_64 for the Ubuntu Vega emulator and ARMv7 for supported Vega Fire TV devices. Setup: https://github.com/techcto/smartdetector/blob/main/docs/HACKATHON-FIELD-GUIDE.md. Native dependency audit evidence is included; a build is not Appstore certification.' --jq '.id')"
          fi
          [[ "$release_id" =~ ^[0-9]+$ ]]
          for asset in smartdetectorconsole_armv7.vpkg smartdetectorconsole_x86_64.vpkg SHA256SUMS sdk-version.txt native-package-lock.json security-audit.json smartdetector-vega-source.tar.gz; do
            test -s "$asset"
            asset_id="$(gh api "repos/$GH_REPO/releases/$release_id/assets" --jq ".[] | select(.name == \"$asset\") | .id")"
            if [ -n "$asset_id" ]; then
              [[ "$asset_id" =~ ^[0-9]+$ ]]
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
            fi
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$asset" > /dev/null
          done
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=legacy
  package:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        target: [armv7, x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load cached Vega SDK builder
        uses: docker/build-push-action@v6
        with:
          context: apps/vega
          platforms: linux/amd64
          load: true
          tags: smartdetector-vega-builder:0.24.12112
          cache-from: type=gha,scope=vega-sdk
          cache-to: type=gha,mode=max,scope=vega-sdk
      - name: Build official SDK project and test client
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          SMARTDETECTOR_VEGA_BUILDER_READY: '1'
          SMARTDETECTOR_VEGA_TARGET: ${{ matrix.target }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          SMARTDETECTOR_RELEASE_VERSION="$version" SMARTDETECTOR_VEGA_BUILD_NUMBER="$GITHUB_RUN_NUMBER" bash apps/vega/scripts/build-docker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: smartdetector-vega-${{ matrix.target }}-${{ github.ref_name }}
          path: |
            apps/vega/build/${{ matrix.target }}-release/*.vpkg
            apps/vega/build/SHA256SUMS
            apps/vega/build/sdk-version.txt
            apps/vega/build/native-package-lock.json
            apps/vega/build/security-audit.json
          if-no-files-found: error
          retention-days: 90
