name: Release SmartDetector MCP AgentCore
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version: {description: Immutable version without leading v, required: true}
permissions: {contents: read, id-token: write}
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  MP_AWS_ECR: ${{ vars.MP_AWS_ECR }}
  AGENTCORE_REPOSITORY: ${{ vars.AGENTCORE_REPOSITORY || 'solodev/smartdetector-agentcore' }}
  ASSETS_BUCKET: ${{ vars.ASSETS_BUCKET || 'smartdetector' }}
jobs:
  release:
    # Configure a separate product before enabling this new publishing path.
    if: ${{ vars.MP_AWS_AGENTCORE_PRODUCT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: 26}
      - name: Select immutable version
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          case "$version" in ''|*[!0-9A-Za-z.-]*) exit 1;; esac
          test -n "$MP_AWS_ECR"
          test -n "$ASSETS_BUCKET"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ vars.MP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MP_AWS_SECRET_ACCESS_KEY }}
      - name: Check publishing repository and log in
        run: |
          aws ecr describe-repositories --repository-names "$AGENTCORE_REPOSITORY" >/dev/null
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$MP_AWS_ECR"
      - uses: docker/setup-buildx-action@v3
      - name: Publish ARM64 AgentCore image
        run: |
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push \
            -f submodules/smartdetector-agentcore/devops/docker/Dockerfile.agentcore \
            -t "$MP_AWS_ECR/$AGENTCORE_REPOSITORY:$RELEASE_VERSION" submodules/smartdetector-agentcore
      - name: Publish runtime quickstart template
        run: |
          template=submodules/smartdetector-agentcore/devops/cloudformation/smartdetector-agentcore-runtime.yaml
          aws s3 cp "$template" "s3://$ASSETS_BUCKET/cloudformation/smartdetector-agentcore-runtime-$RELEASE_VERSION.yaml" --content-type text/yaml --cache-control 'max-age=31536000,immutable'
          aws s3 cp "$template" "s3://$ASSETS_BUCKET/cloudformation/smartdetector-agentcore-runtime.yaml" --content-type text/yaml --cache-control no-cache
          curl --fail --silent --show-error --head "https://$ASSETS_BUCKET.s3.$AWS_REGION.amazonaws.com/cloudformation/smartdetector-agentcore-runtime-$RELEASE_VERSION.yaml" >/dev/null
      - name: Submit separate AgentCore Marketplace delivery changeset
        env:
          MP_AWS_AGENTCORE_PRODUCT_ID: ${{ vars.MP_AWS_AGENTCORE_PRODUCT_ID }}
          MP_AWS_MARKETPLACE_PRODUCT_ID: ${{ vars.MP_AWS_MARKETPLACE_PRODUCT_ID }}
        run: bash submodules/smartdetector-agentcore/devops/changeset.sh
